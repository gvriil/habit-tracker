version: '3'

services:
  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    env_file:
      - ./.env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    restart: always

  redis:
    image: redis:7
    restart: always

  web:
    build: .
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ./.env
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
      - .:/app
    command: >
      bash -c "python manage.py migrate &&
               python manage.py collectstatic --noinput &&
               gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  celery:
    build: .
    restart: always
    depends_on:
      - redis
      - db
    env_file:
      - ./.env
    volumes:
      - .:/app
    command: celery -A config worker --autoscale=10,3 -l info

  celery-beat:
    build: .
    restart: always
    depends_on:
      - redis
      - celery
    env_file:
      - ./.env
    volumes:
      - .:/app
    command: celery -A config beat -l info

  nginx:
    image: nginx:1.21
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_value:/var/html/static/
      - media_value:/var/html/media/
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  static_value:
  media_value: