name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, ci-cd-setup]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: habit_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify bot code
        run: |
          python -c "from telegram_bot import *; print('Bot code successfully imported')"

      - name: Set Python path
        run: |
          echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      - name: Fix tests directory structure
        run: |
          if [ -f "users/tests/__init__.py" ]; then
            rm users/tests/__init__.py
            echo "Removed __init__.py from users/tests directory"
          fi
          if [ ! -f "users/__init__.py" ]; then
            touch users/__init__.py
            echo "Created __init__.py in users directory"
          fi

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DEBUG: True
          DB_NAME: habit_tracker
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          python -m pytest users/ habits/ telegram_bot/

  build:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ success() && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker-compose build

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push' }}
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git pull
            docker-compose down
            docker-compose up -d --build
            docker-compose exec web python manage.py migrate
            docker-compose exec web python manage.py collectstatic --noinput
